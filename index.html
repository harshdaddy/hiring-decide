<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Hiring decision</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 20px; line-height: 1.5; max-width: 560px;
         margin: 56px auto; padding: 0 20px; color: #111; background: #fff; }
  #msg { font-size: 28px; font-weight: bold; }
  #sub { margin-top: 12px; color: #333; }
  button { font-size: 20px; padding: 12px 28px; margin-top: 28px; border-radius: 8px; border: 2px solid #111;
           background: #fff; cursor: pointer; }
  #note { margin-top: 36px; font-size: 16px; color: #666; }
</style>
</head>
<body>
<div id="msg">Working...</div>
<div id="sub"></div>
<div id="btn"></div>
<div id="note"></div>
<script>
// Hiring decision links. This page holds no secrets and no addresses. Each link carries:
//   a = invite | reject | undo, e = applicant email, r = role, t = signed token for that exact
//   applicant + action, x = which hiring script to send it to.
// The hiring script checks the token before doing anything. The request goes out without
// Google cookies, so being signed into several Google accounts can't break it.
(function () {
  var q = new URLSearchParams(location.search);
  var P = { a: q.get('a'), e: q.get('e'), r: q.get('r') || '', t: q.get('t') };
  var x = q.get('x') || '';
  var $ = function (id) { return document.getElementById(id); };

  function show(res) {
    $('msg').textContent = res.message || '';
    $('sub').textContent = res.sub || '';
    $('btn').innerHTML = '';
    $('note').textContent = res.ok ? 'You can close this tab.' : '';
    if (res.undo) {
      var b = document.createElement('button');
      b.textContent = 'Undo';
      b.onclick = function () {
        $('btn').innerHTML = '';
        $('msg').textContent = 'Undoing...';
        $('sub').textContent = '';
        $('note').textContent = '';
        run({ a: 'undo', e: P.e, r: P.r, t: res.undo });
      };
      $('btn').appendChild(b);
    }
  }

  function run(p) {
    fetch('https://script.google.com/macros/s/' + x + '/exec', {
      method: 'POST',
      body: JSON.stringify({ action: 'link', a: p.a, e: p.e, r: p.r, t: p.t }),
      credentials: 'omit',
      redirect: 'follow'
    })
      .then(function (res) { return res.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || 'The hiring script said no.');
        show(d.result);
      })
      .catch(function (err) {
        show({ ok: false, message: 'Could not reach the hiring script.',
               sub: 'Try the link again in a minute. (' + (err && err.message || err) + ')' });
      });
  }

  if (!/^[\w-]{20,}$/.test(x) || !P.a || !P.e || !P.t) {
    show({ ok: false, message: 'This link is not complete.', sub: 'Open it straight from the Discord ping.' });
  } else {
    run(P);
  }
})();
</script>
</body>
</html>
